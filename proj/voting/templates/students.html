<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Student | Student Voting System</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: cornsilk;
      color: #222;
    }
    header {
      background: #14532d;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    header img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: cornsilk;
    }
    .title {
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin: 0 25px 0 10px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
    }
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
    }
    nav a:hover, nav a.active {
      background: #0d3a1f;
    }
    nav a.logout {
      border: 1px solid white;
      margin-left: 10px;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 25px;
    }
    h1 {
      color: #14532d;
      margin-bottom: 5px;
    }
    h2 {
      color: #14532d;
      margin-top: 35px;
    }
    form {
      max-width: 420px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 14px;
    }
    input, select, textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      margin-top: 5px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid #888;
      border-radius: 4px;
    }
    input[readonly] {
      background: #e6e6e6;
    }
    button, .btn {
      display: inline-block;
      padding: 10px 16px;
      margin: 0 6px 6px 0;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .green { background: #14532d; }
    .dark { background: #333; }
    .red { background: #b00020; }
    .blue { background: #0b5ed7; }
    .grey { background: #777; }
    #msg {
      color: #b00020;
      font-weight: bold;
      min-height: 20px;
    }
    .tablebox {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #ddd;
    }
    td button { padding: 5px 10px; font-size: 14px; margin: 0 4px 0 0; }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="IUIU logo">
    <span class="title">Student Voting System</span>
    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="students.html" class="active">Students</a></li>
        <li><a href="election.html">Election</a></li>
        <li><a href="position.html">Position</a></li>
        <li><a href="candidate.html">Candidate</a></li>
        <li><a href="voter.html">Voter</a></li>
        <li><a href="ballot.html">Ballot</a></li>
        <li><a href="login.html" class="logout" onclick="return doLogout(event)">Log out</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Register Student</h1>
    <p>Add, edit or remove students on the register.</p>

    <form id="f">
      <label>Student ID
        <input type="text" id="studentid">
      </label>
      <label>First Name
        <input type="text" id="firstname">
      </label>
      <label>Last Name
        <input type="text" id="lastname">
      </label>
      <label>Gender
        <select id="gender">
          <option value="">-- Select --</option>
          <option>Male</option>
          <option>Female</option>
        </select>
      </label>
      <label>Course
        <input type="text" id="course">
      </label>
      <label>Year of Study
        <select id="year">
          <option value="">-- Select --</option>
          <option>Year 1</option>
          <option>Year 2</option>
          <option>Year 3</option>
          <option>Year 4</option>
        </select>
      </label>
      <label>Session
        <select id="session">
          <option value="">-- Select --</option>
          <option>Day</option>
          <option>Evening</option>
          <option>Weekend</option>
        </select>
      </label>

      <p id="msg"></p>
      <button type="button" class="green" id="saveBtn" onclick="crud.save()">Register</button>
      <button type="button" class="grey" onclick="crud.clear()">Clear</button>
    </form>
    <h2>Registered Students</h2>
    <div class="tablebox">
      <table>
        <thead><tr><th>Student ID</th><th>First Name</th><th>Last Name</th><th>Gender</th><th>Course</th><th>Year of Study</th><th>Session</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/crud.js"></script>
  <script>
    var crud = new Crud({
      resource: "student", label: "Student",
      ids:  ["studentid", "firstname", "lastname", "gender", "course", "year", "session"],
      keys: ["student_id", "first_name", "last_name", "gender", "course", "year", "session"],
      cols: [function (r) { return r.student_id; }, function (r) { return r.first_name; },
             function (r) { return r.last_name; }, function (r) { return r.gender; },
             function (r) { return r.course; }, function (r) { return r.year; },
             function (r) { return r.session; }],
      saveBtn: "saveBtn", saveText: "Register"
    });
    crud.init();
  </script>
</body>
</html>
