<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate | Student Voting System</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: cornsilk;
      color: #222;
    }
    header {
      background: #14532d;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    header img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: cornsilk;
    }
    .title {
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin: 0 25px 0 10px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
    }
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
    }
    nav a:hover, nav a.active {
      background: #0d3a1f;
    }
    nav a.logout {
      border: 1px solid white;
      margin-left: 10px;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 25px;
    }
    h1 {
      color: #14532d;
      margin-bottom: 5px;
    }
    h2 {
      color: #14532d;
      margin-top: 35px;
    }
    form {
      max-width: 420px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 14px;
    }
    input, select, textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      margin-top: 5px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid #888;
      border-radius: 4px;
    }
    input[readonly] {
      background: #e6e6e6;
    }
    button, .btn {
      display: inline-block;
      padding: 10px 16px;
      margin: 0 6px 6px 0;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .green { background: #14532d; }
    .dark { background: #333; }
    .red { background: #b00020; }
    .blue { background: #0b5ed7; }
    .grey { background: #777; }
    #msg {
      color: #b00020;
      font-weight: bold;
      min-height: 20px;
    }
    .tablebox {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #ddd;
    }
    td button { padding: 5px 10px; font-size: 14px; margin: 0 4px 0 0; }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="IUIU logo">
    <span class="title">Student Voting System</span>
    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="students.html">Students</a></li>
        <li><a href="election.html">Election</a></li>
        <li><a href="position.html">Position</a></li>
        <li><a href="candidate.html" class="active">Candidate</a></li>
        <li><a href="voter.html">Voter</a></li>
        <li><a href="ballot.html">Ballot</a></li>
        <li><a href="login.html" class="logout" onclick="return doLogout(event)">Log out</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Candidate</h1>
    <p>Register students as candidates for a position.</p>

    <form id="f">
      <label>Candidate ID
        <input type="text" id="candidate_id" placeholder="Auto-generated" readonly>
      </label>
      <label>Student
        <select id="student"></select>
      </label>
      <label>Position
        <select id="position"></select>
      </label>
      <label>Votes received
        <input type="number" id="votes" value="0" readonly>
      </label>

      <p id="msg"></p>
      <button type="button" class="green" id="saveBtn" onclick="crud.save()">Save Candidate</button>
      <button type="button" class="blue" onclick="showInfo()">Display Information</button>
      <button type="button" class="grey" onclick="crud.clear()">Clear</button>
    </form>
    <h2>Registered Candidates</h2>
    <div class="tablebox">
      <table>
        <thead><tr><th>Candidate ID</th><th>Student</th><th>Position</th><th>Election</th><th>Votes received</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/crud.js"></script>
  <script>
    var crud = new Crud({
      resource: "candidate", label: "Candidate",
      ids: ["student", "position"], keys: ["student_id", "position_id"],
      extra: { candidate_id: "id", votes: "votes" },
      required: "Please choose a student and a position.",
      selects: [
        { id: "student", resource: "student", label: function (i) { return i.name; } },
        { id: "position", resource: "position", label: function (i) { return i.title + " (" + i.election_title + ")"; } }
      ],
      cols: [function (r) { return r.id; }, function (r) { return r.student_name; },
             function (r) { return r.position_title; }, function (r) { return r.election_title; },
             function (r) { return r.votes; }],
      saveBtn: "saveBtn", saveText: "Save Candidate"
    });
    crud.init();

    function showInfo() {
      var r = crud.editingRow();
      if (!r) { say("Pick a candidate first: press Edit on a row in the table."); return; }
      say(r.student_name + " is standing for " + r.position_title + " in " + r.election_title +
          " and has " + r.votes + " vote(s).", true);
    }
  </script>
</body>
</html>
