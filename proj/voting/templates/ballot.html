<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ballot | Student Voting System</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: cornsilk;
      color: #222;
    }
    header {
      background: #14532d;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    header img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: cornsilk;
    }
    .title {
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin: 0 25px 0 10px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
    }
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
    }
    nav a:hover, nav a.active {
      background: #0d3a1f;
    }
    nav a.logout {
      border: 1px solid white;
      margin-left: 10px;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 25px;
    }
    h1 {
      color: #14532d;
      margin-bottom: 5px;
    }
    h2 {
      color: #14532d;
      margin-top: 35px;
    }
    form {
      max-width: 420px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 14px;
    }
    input, select, textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      margin-top: 5px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid #888;
      border-radius: 4px;
    }
    input[readonly] {
      background: #e6e6e6;
    }
    button, .btn {
      display: inline-block;
      padding: 10px 16px;
      margin: 0 6px 6px 0;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .green { background: #14532d; }
    .dark { background: #333; }
    .red { background: #b00020; }
    .blue { background: #0b5ed7; }
    .grey { background: #777; }
    #msg {
      color: #b00020;
      font-weight: bold;
      min-height: 20px;
    }
    .tablebox {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #ddd;
    }
    fieldset {
      background: white;
      border: 1px solid #aaa;
      margin-bottom: 14px;
    }
    fieldset label {
      font-weight: normal;
      margin-bottom: 6px;
    }
    input[type=radio] {
      display: inline;
      width: auto;
      margin: 0 6px 0 0;
    }
    td button { padding: 5px 10px; font-size: 14px; margin: 0 4px 0 0; }
  </style>
</head>
<body>

  <header>
    <img src="voting/static/logo.png" alt="IUIU logo">
    <span class="title">Student Voting System</span>
    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="students.html">Students</a></li>
        <li><a href="election.html">Election</a></li>
        <li><a href="position.html">Position</a></li>
        <li><a href="candidate.html">Candidate</a></li>
        <li><a href="voter.html">Voter</a></li>
        <li><a href="ballot.html" class="active">Ballot</a></li>
        <li><a href="login.html" class="logout" onclick="return doLogout(event)">Log out</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Ballot</h1>
    <p>Choose one candidate for each position, then submit. Only ongoing elections are listed.</p>

    <form id="f">
      <label>Election
        <select id="election" onchange="loadBallot()"></select>
      </label>
      <label>Voter
        <select id="voter"></select>
      </label>

      <div id="positions"></div>

      <p id="msg"></p>
      <button type="button" class="green" onclick="submitBallot()">Submit Ballot</button>
      <button type="button" class="grey" onclick="loadBallot()">Clear</button>
    </form>
    <h2>Submitted Ballots</h2>
    <div class="tablebox">
      <table>
        <thead><tr><th>Election</th><th>Position</th><th>Candidate name</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/crud.js"></script>
  <script>
    var positions = [];

    async function init() {
      try {
        var elections = await api("/api/election/");
        fillSelect("election", elections.filter(function (e) { return e.status === "Ongoing"; })
          .map(function (e) { return { id: e.id, label: e.title }; }));
        fillSelect("voter", []);
        await loadTable();
      } catch (e) { say(e.message); }
    }

    async function loadTable() {
      var rows = await api("/api/ballot/");
      document.getElementById("rows").innerHTML = rows.map(function (r) {
        return "<tr><td>" + esc(r.election_title) + "</td><td>" + esc(r.position_title) +
               "</td><td>" + esc(r.candidate_name) + "</td></tr>";
      }).join("") || '<tr><td colspan="3">No ballots submitted yet.</td></tr>';
    }

    async function loadBallot() {
      var id = document.getElementById("election").value;
      var box = document.getElementById("positions");
      say("");
      if (!id) { box.innerHTML = ""; fillSelect("voter", []); positions = []; return; }
      try {
        var data = await api("/api/ballot/form/" + id + "/");
        positions = data.positions;
        fillSelect("voter", data.voters);
        box.innerHTML = positions.map(function (p) {
          return "<fieldset><legend>" + esc(p.title) + "</legend>" +
            p.candidates.map(function (c) {
              return '<label><input type="radio" name="pos_' + p.id + '" value="' + c.id + '"> ' + esc(c.name) + "</label>";
            }).join("") + "</fieldset>";
        }).join("") || "<p>No candidates have been registered for this election yet.</p>";
      } catch (e) { say(e.message); }
    }

    async function submitBallot() {
      var election = document.getElementById("election").value;
      var voter = document.getElementById("voter").value;
      if (election == "") { say("Please select an election."); return; }
      if (voter == "") { say("Please select the voter casting this ballot."); return; }
      var choices = {};
      for (var i = 0; i < positions.length; i++) {
        var pick = document.querySelector('input[name="pos_' + positions[i].id + '"]:checked');
        if (!pick) { say("Please choose a candidate for " + positions[i].title + "."); return; }
        choices[positions[i].id] = pick.value;
      }
      if (!confirm("Submit your ballot? You cannot change it afterwards.")) return;
      try {
        await api("/api/ballot/submit/", "POST", { election: election, voter: voter, choices: choices });
        alert("Ballot submitted successfully. Thank you for voting.");
        await loadBallot();
        await loadTable();
        say("Ballot submitted successfully.", true);
      } catch (e) { say(e.message); }
    }

    init();
  </script>
</body>
</html>
