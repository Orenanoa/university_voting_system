<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Election | Student Voting System</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: cornsilk;
      color: #222;
    }
    header {
      background: #14532d;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    header img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: cornsilk;
    }
    .title {
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin: 0 25px 0 10px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
    }
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
    }
    nav a:hover, nav a.active {
      background: #0d3a1f;
    }
    nav a.logout {
      border: 1px solid white;
      margin-left: 10px;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 25px;
    }
    h1 {
      color: #14532d;
      margin-bottom: 5px;
    }
    h2 {
      color: #14532d;
      margin-top: 35px;
    }
    form {
      max-width: 420px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 14px;
    }
    input, select, textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      margin-top: 5px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid #888;
      border-radius: 4px;
    }
    input[readonly] {
      background: #e6e6e6;
    }
    button, .btn {
      display: inline-block;
      padding: 10px 16px;
      margin: 0 6px 6px 0;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .green { background: #14532d; }
    .dark { background: #333; }
    .red { background: #b00020; }
    .blue { background: #0b5ed7; }
    .grey { background: #777; }
    #msg {
      color: #b00020;
      font-weight: bold;
      min-height: 20px;
    }
    .tablebox {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #ddd;
    }
    td button { padding: 5px 10px; font-size: 14px; margin: 0 4px 0 0; }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="IUIU logo">
    <span class="title">Student Voting System</span>
    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="students.html">Students</a></li>
        <li><a href="election.html" class="active">Election</a></li>
        <li><a href="position.html">Position</a></li>
        <li><a href="candidate.html">Candidate</a></li>
        <li><a href="voter.html">Voter</a></li>
        <li><a href="ballot.html">Ballot</a></li>
        <li><a href="login.html" class="logout" onclick="return doLogout(event)">Log out</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Election</h1>
    <p>Create an election, start it, and close it when voting ends. Use Edit in the table to pick one.</p>

    <form id="f">
      <label>Election ID
        <input type="text" id="election_id" placeholder="Auto-generated" readonly>
      </label>
      <label>Title
        <input type="text" id="title" placeholder="e.g. Guild Elections 2026">
      </label>
      <label>Voters (registered)
        <input type="number" id="voters" value="0" readonly>
      </label>
      <label>Status
        <select id="status">
          <option value="">-- Select --</option>
          <option>Pending</option>
          <option>Ongoing</option>
          <option>Ended</option>
        </select>
      </label>

      <p id="msg"></p>
      <button type="button" class="dark" id="saveBtn" onclick="crud.save()">Save</button>
      <button type="button" class="green" onclick="setStatus('Ongoing')">Start Election</button>
      <button type="button" class="red" onclick="setStatus('Ended')">End Election</button>
      <button type="button" class="blue" onclick="showCandidates()">Display Candidates</button>
      <button type="button" class="grey" onclick="crud.clear()">Clear</button>
    </form>
    <h2>Elections</h2>
    <div class="tablebox">
      <table>
        <thead><tr><th>Election ID</th><th>Title</th><th>Voters (registered)</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/crud.js"></script>
  <script>
    var crud = new Crud({
      resource: "election", label: "Election",
      ids: ["title", "status"], keys: ["title", "status"],
      extra: { election_id: "id", voters: "voters" },
      required: "Please enter a title and choose a status.",
      cols: [function (r) { return r.id; }, function (r) { return r.title; },
             function (r) { return r.voters; }, function (r) { return r.status; }],
      saveBtn: "saveBtn", saveText: "Save"
    });
    crud.init();

    async function setStatus(status) {
      var id = document.getElementById("election_id").value;
      if (!id) { say("Pick an election first: press Edit on a row in the table."); return; }
      if (status === "Ended" && !confirm("End this election? Voting will close.")) return;
      try {
        await api("/api/election/" + id + "/status/", "POST", { status: status });
        say(status === "Ongoing" ? "Election started." : "Election ended.", true);
        await crud.load();
        crud.edit(parseInt(id, 10));
        say(status === "Ongoing" ? "Election started." : "Election ended.", true);
      } catch (e) { say(e.message); }
    }

    function showCandidates() { window.location.href = "candidate.html"; }
  </script>
</body>
</html>
