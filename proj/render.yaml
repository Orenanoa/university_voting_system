services:
  - type: web
    name: university-elections
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn votingsystem.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
